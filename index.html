<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Blaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --neon-green: #39ff14;
            --neon-orange: #ff6600;
            --dark-bg: #0a0a12;
            --grid-color: rgba(255, 0, 255, 0.15);
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: var(--dark-bg);
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
        }

        /* Scanline effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 1000;
        }

        /* Grid background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            perspective: 500px;
            z-index: -1;
        }

        .grid-bg::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(255, 0, 255, 0.05) 50%,
                rgba(255, 0, 255, 0.1)
            );
            transform: rotateX(60deg);
            transform-origin: bottom;
        }

        /* Stars */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Main title */
        .title {
            font-size: clamp(1.5rem, 6vw, 3.5rem);
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: glow 2s ease-in-out infinite alternate;
            text-shadow: 
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
            color: #fff;
            letter-spacing: 4px;
        }

        @keyframes glow {
            from {
                text-shadow: 
                    0 0 10px var(--neon-pink),
                    0 0 20px var(--neon-pink),
                    0 0 40px var(--neon-pink),
                    0 0 80px var(--neon-pink);
            }
            to {
                text-shadow: 
                    0 0 20px var(--neon-cyan),
                    0 0 40px var(--neon-cyan),
                    0 0 60px var(--neon-cyan),
                    0 0 100px var(--neon-cyan);
            }
        }

        /* Tagline */
        .tagline {
            font-size: clamp(0.6rem, 2vw, 1rem);
            color: var(--neon-yellow);
            margin-bottom: 50px;
            animation: blink 1s steps(2) infinite;
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Game list */
        .games {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .game-btn {
            display: block;
            padding: 25px 30px;
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.7rem, 2vw, 1rem);
            text-decoration: none;
            color: #fff;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            border: 3px solid var(--neon-cyan);
            position: relative;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 
                0 0 10px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .game-btn:hover {
            transform: scale(1.02);
            border-color: var(--neon-pink);
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.5),
                inset 0 0 30px rgba(255, 0, 255, 0.2);
        }

        .game-btn:active {
            transform: scale(0.98);
        }

        .game-btn.coming-soon {
            opacity: 0.5;
            border-color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        .game-btn.coming-soon:hover {
            transform: none;
            border-color: #444;
            box-shadow: none;
        }

        .game-btn .status {
            display: block;
            font-size: 0.5rem;
            margin-top: 10px;
            color: var(--neon-green);
        }

        .game-btn.coming-soon .status {
            color: var(--neon-orange);
        }

        /* Dragon emoji for Chinese */
        .dragon::before {
            content: "🐉 ";
        }
        .dragon::after {
            content: " 🐉";
        }

        /* K-Pop style */
        .kpop::before {
            content: "💜 ";
        }
        .kpop::after {
            content: " 💜";
        }

        /* Portuguese */
        .luso::before {
            content: "⚓ ";
        }
        .luso::after {
            content: " ⚓";
        }

        /* Kids alphabet */
        .alphabet::before {
            content: "🎈 ";
        }
        .alphabet::after {
            content: " 🎈";
        }

        /* Word warrior */
        .warrior::before {
            content: "⚔️ ";
        }
        .warrior::after {
            content: " ⚔️";
        }

        /* High score style footer */
        .footer {
            font-size: 0.6rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
            line-height: 2;
        }

        .footer .copyright {
            color: #666;
            margin-top: 20px;
        }

        /* Decorative corners */
        .corner {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 3px solid var(--neon-pink);
            opacity: 0.5;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .corner {
                width: 50px;
                height: 50px;
            }

            .game-btn {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    
    <div class="stars" id="stars"></div>
    
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="container">
        <h1 class="title">Language Blaster</h1>
        <p class="tagline">>>> INSERT COIN TO BLAST OFF <<<</p>

        <div class="games">
            <a href="chinese/" class="game-btn dragon">
                Dragon Blaster
                <span class="status">▶ PLAY NOW</span>
            </a>

            <a href="korean/" class="game-btn kpop">
                K-Popper
                <span class="status">▶ PLAY NOW</span>
            </a>

            <div class="game-btn coming-soon luso">
                Luso Blaster
                <span class="status">🔒 COMING SOON</span>
            </div>

            <div class="game-btn coming-soon alphabet">
                Alphabet Blaster
                <span class="status">🔒 COMING SOON</span>
            </div>

            <div class="game-btn coming-soon warrior">
                Word Warrior
                <span class="status">🔒 COMING SOON</span>
            </div>
        </div>

        <div class="footer">
            <div>1 PLAYER GAME</div>
            <div class="copyright">© 2025 LANGUAGE BLASTER</div>
        </div>
    </div>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
            starsContainer.appendChild(star);
        }

        // Add retro click sound effect (visual feedback)
        document.querySelectorAll('.game-btn:not(.coming-soon)').forEach(btn => {
            btn.addEventListener('click', function(e) {
                this.style.filter = 'brightness(2)';
                setTimeout(() => {
                    this.style.filter = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
